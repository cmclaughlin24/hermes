# Resources:
#   - https://www.artillery.io/docs
# Useful Commands:
#   - artillery run -o <filename>.json artillery.yaml
#   - artillery report <filename>.json
#   - artillery --help
config:
  http:
    extendedMetrics: true
    maxSockets: 10
  plugins:
    apdex: {}
  environments:
    docker:
      target: 'http://localhost:3002'
      phases:
        - duration: 60
          arrivalRate: 5
          name: 'Warm-up (5 arrivals/sec)'
        - duration: 60
          arrivalRate: 5
          rampTo: 20
          name: 'Ramp-up to Sustained Load (20 arrivals/sec)'
        - duration: 180
          arrivalRate: 20
          name: 'Sustained Load (20 arrivals/sec)'
        - duration: 60
          arrivalRate: 20
          rampTo: 100
          name: 'Ramp-up to Heavy Load (100 arrivals/sec)'
        - duration: 180
          arrivalRate: 100
          name: 'Heavy Load (100 arrivals/sec)'
        - duration: 60
          arrivalRate: 100
          rampTo: 200
          name: 'Ramp-up to Stress Load (200 arrivals/sec)'
        - duration: 180
          arrivalRate: 200
          name: 'Stress Load (200 arrivals/sec)'
        - duration: 60
          arrivalRate: 200
          rampTo: 400
          name: 'Ramp-up to Max Load (400 arrivals/sec)'
        - duration: 180
          arrivalRate: 400
          name: 'Max Load (400 arrivals/sec)'
scenarios:
  - name: 'Verify Json Web Token (JWT)'
    flow:
      - post:
          url: '/graphql'
          headers:
            Content-Type: 'application/json'
          json:
            query: |
              mutation {
                verifyAccessToken(token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..mUrJMq2dI5w7JP-z1bKhO6YsIN-iOhrY0jNFeqaY4Ro") {
                  sub
                  name
                  authorization_details
                }
              }
    weight: 1
